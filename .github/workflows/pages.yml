name: Deploy web preview

# 実機がなくても動作を確認できるように、Flutter Web ビルドを
# GitHub Pages へ公開する。公開先は公開リポジトリと同じく誰でも閲覧できる。
#
# 初回だけリポジトリ設定が必要:
#   Settings → Pages → Build and deployment → Source を "GitHub Actions" にする。
# Actions のトークンでは Pages サイトを新規作成できないため、
# 未設定のうちはデプロイを飛ばし、ビルド成果物だけを artifact として残す。
on:
  push:
    branches:
      - main
      - claude/poker-coaching-app-0p1ya7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.configure.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # CanvasKit を同梱して CDN 依存を減らす。
      # base-href は Pages の配信パス (/<repo>/) に合わせる。
      - name: Build web
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      # Pages が未設定でも成果物を取り出せるようにしておく。
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      # Pages 未設定なら失敗させず、案内だけ出してデプロイを飛ばす。
      - id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages が未設定
        if: steps.configure.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages が有効になっていません。" \
               "Settings → Pages → Source を 'GitHub Actions' にすると、" \
               "次回の push から自動で公開されます。"

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
